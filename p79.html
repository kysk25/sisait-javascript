<html>
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ"
      crossorigin="anonymous"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-+PW0IDVGGwmpaBQvcXY+W0BcpHpITFB3dSfSoGvDdHtLbrLpSbpGcvtQRM/BJpz+"
      crossorigin="anonymous"
    ></script>

    <script>
      var expression = "";

      function add(character) {
        expression = expression + character;
        document.getElementById("display").value = expression;
      }
      function compute() {
        expression = "(" + expression +")";
        document.getElementById("display").value = eval(expression);
      }
      function clearDisplay() {
        expression = "";
        document.getElementById("display").value = 0;
      }
    </script>
  </head>
  <body>
    <form>
      계산기 <input id="display" value="0" size="30" />
      <br />
      <input type="button" value=" 7 " onclick="add('7')" <button type="button" class="theme-primary btn-solid btn-styled">
        
      </button>
      <input type="button" value=" 8 " onclick="add('8')" <button type="button" class="theme-primary btn-solid btn-styled">
        
      </button>
      <input type="button" value=" 9 " onclick="add('9')" <button type="button" class="theme-primary btn-solid btn-styled">
        
      </button>
      <input type="button" value=" / " onclick="add('/')" <button type="button" class="theme-primary btn-solid btn-styled">
       
      </button>
      <br />
      <input type="button" value=" 4 " onclick="add('4')" <button type="button" class="theme-primary btn-solid btn-styled">
        
      </button>
      <input type="button" value=" 5 " onclick="add('5')" <button type="button" class="theme-primary btn-solid btn-styled">
        
      </button>
      <input type="button" value=" 6 " onclick="add('6')" <button type="button" class="theme-primary btn-solid btn-styled">
        
      </button>
      <input type="button" value=" * " onclick="add('*')" <button type="button" class="theme-primary btn-solid btn-styled">
        
      </button>
      <br />
      <input type="button" value=" 1 " onclick="add('1')" <button type="button" class="theme-primary btn-solid btn-styled">
        
      </button>
      <input type="button" value=" 2 " onclick="add('2')" <button type="button" class="theme-primary btn-solid btn-styled">
        
      </button>
      <input type="button" value=" 3 " onclick="add('3')" <button type="button" class="theme-primary btn-solid btn-styled">
        
      </button>
      <input type="button" value=" - " onclick="add('-')" <button type="button" class="theme-primary btn-solid btn-styled">
        
      </button>
      <br />
      <input type="button" value=" 0 " onclick="add('0')" <button type="button" class="theme-primary btn-solid btn-styled">
        
      </button>
      <input type="button" value=" + " onclick="add('+')" <button type="button" class="theme-primary btn-solid btn-styled">
        
      </button>
      <br />
      <input type="button" value="Clear" onclick="clearDisplay()" 
      <button type="button" class="theme-primary btn-solid btn-styled">
        
      </button>
      <input type="button" value="Enter" name="enter" onclick="compute()" 
      <button type="button" class="theme-primary btn-solid btn-styled">
       
      </button>
    </form>
  </body>
</html>
